<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>سديم | Sadeem</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Orbitron:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
@property --ac{syntax:'<color>';inherits:true;initial-value:#7a5cff}
:root{--ac:#7a5cff;--bg:#05030d;--tx:#f2eeff;--mut:#a79fc4;--gl:rgba(255,255,255,.07);color-scheme:dark;transition:--ac 1.1s ease;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.neb{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 25% 35%,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%),radial-gradient(35% 40% at 80% 70%,color-mix(in srgb,var(--ac) 25%,#3a1d7a),transparent 70%);filter:blur(30px);animation:dr 24s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(4%,-3%) rotate(6deg) scale(1.1)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 20px 56px;display:grid;grid-template-columns:1fr;align-items:center;min-height:100vh}
h1{font-family:'Lalezar',Tahoma,sans-serif;font-weight:700;font-size:clamp(40px,6.4vw,76px);line-height:1.05;margin:0 0 14px;background:linear-gradient(100deg,#fff 20%,var(--ac) 60%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px color-mix(in srgb,var(--ac) 50%,transparent)}
.sub{color:var(--mut);margin:0 0 26px;font-size:17px;line-height:1.7;max-width:34ch}
.panel{background:var(--gl);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 60px color-mix(in srgb,var(--ac) 22%,transparent)}
label,.lb{display:block;font-size:14px;color:var(--mut);margin:16px 0 8px}.lb:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 8px;border-radius:12px;font-size:13px;text-align:center;line-height:1.35;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;gap:6px;transition:.25s}
.ch i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
.ch:hover{transform:translateY(-2px);border-color:var(--c)}.ch[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
.ch:focus-visible,input:focus-visible,#go:focus-visible{outline:2px solid #fff;outline-offset:2px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:var(--tx);font:inherit;font-size:16px}
input:focus{border-color:var(--ac)}
#go{all:unset;box-sizing:border-box;cursor:pointer;width:100%;margin-top:22px;padding:15px;text-align:center;border-radius:14px;font-family:'Lalezar',Tahoma,sans-serif;font-size:21px;font-weight:700;color:#0a0618;background:linear-gradient(100deg,#fff,var(--ac));box-shadow:0 8px 40px color-mix(in srgb,var(--ac) 60%,transparent);transition:.2s}
#go:hover{transform:translateY(-2px) scale(1.01)}
.stage{perspective:900px;display:flex;justify-content:center;position:relative}
.stage::after{content:"";position:absolute;bottom:-26px;width:60%;height:34px;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 70%,transparent),transparent);filter:blur(10px)}
.tk{position:relative;width:min(330px,76vw);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s;transform-style:preserve-3d;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 0 34px color-mix(in srgb,var(--ac) 55%,transparent))}
@keyframes fl{50%{translate:0 -12px}}
.tk.sw{animation:sp .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes sp{from{transform:rotateY(-100deg) scale(.7);opacity:.2}}
canvas#tk{width:100%;display:block;border-radius:10px}
.sh{position:absolute;inset:0;border-radius:10px;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.55),transparent 42%),linear-gradient(115deg,transparent 30%,rgba(255,80,200,.25) 45%,rgba(80,220,255,.25) 55%,transparent 70%)}
#cd{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:rgba(5,3,13,.82);font-family:'Lalezar',sans-serif;font-size:min(40vw,260px);color:#fff;text-shadow:0 0 60px var(--ac)}
#cd.on{display:grid}#cd.fl{background:#fff;color:transparent;transition:background .5s}
#md{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(5,3,13,.92);text-align:center;padding:20px}#md.on{display:grid}#md img{max-height:70vh;max-width:90vw}
section{text-align:center}.panel{text-align:start}html[lang=en] h1,html[lang=en] #go,html[lang=en] .acts button,html[lang=en] #cd{font-family:"Orbitron",sans-serif}html[lang=en] #go,html[lang=en] .acts button{font-size:15px}html[lang=en] h1{letter-spacing:.08em}.pv{color:var(--mut);font-size:12.5px;margin:12px 0 0;text-align:center;line-height:1.6}.acc{display:inline-block;margin:0 0 20px;padding:7px 16px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);background:rgba(0,0,0,.35);color:var(--tx);text-decoration:none;font-size:15px}.acc[hidden]{display:none}.acc:hover{background:color-mix(in srgb,var(--ac) 25%,transparent)}.acc:focus-visible{outline:2px solid #fff}#lg{all:unset;cursor:pointer;position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:16px;z-index:5;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.4);font-size:14px;color:#fff;backdrop-filter:blur(8px)}#lg:focus-visible{outline:2px solid #fff}.sub{margin-inline:auto}#out{display:none;text-align:center}body.done section{display:none}body.done #out{display:block}.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:44px}.acts button{all:unset;cursor:pointer;padding:13px 22px;border-radius:14px;font-family:'Lalezar',Tahoma,sans-serif;font-size:19px;font-weight:700;color:#0a0618;background:linear-gradient(100deg,#fff,var(--ac));box-shadow:0 8px 34px color-mix(in srgb,var(--ac) 55%,transparent)}.acts .g{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid rgba(255,255,255,.2);box-shadow:none}.acts button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr;gap:30px;padding-top:18px}.stage{order:-1}.sub{max-width:none}}
@media(prefers-reduced-motion:reduce){.tk,.neb{animation:none}}
</style></head><body>
<canvas id="sky"></canvas><div class="neb"></div>
<main>
<section>
<button id="lg" aria-label="Language">EN</button><h1 data-i="t">سديم</h1><a class="acc" hidden><span data-i="ib"></span> <bdi></bdi></a>
<p class="sub" data-i="s">اختر كليتك واكتب بياناتك، وتظهر لك تذكرتك الخاصة جاهزة للحفظ والمشاركة.</p>
<div class="panel">
<div class="lb" data-i="c">الكلية</div><div class="cols" id="cl"></div>
<label for="nm" data-i="n">الاسم</label><input dir="auto" data-p="pn" id="nm" maxlength="40" placeholder="اكتب اسمك" autocomplete="name">
<label for="mj" data-i="m">التخصص</label><input dir="auto" data-p="pm" id="mj" maxlength="48" placeholder="مثال: هندسة ميكانيكية">
<p id="er" role="alert" style="color:#ff8a8a;min-height:20px;margin:12px 0 0;font-size:14px"></p><button id="go" data-i="go">سجّل واستلم تذكرتك</button><p class="pv" data-i="pv" hidden></p>
</div></section>
<div id="out"><div class="stage" id="stg"><div class="tk" id="tkw"><canvas id="tk" width="652" height="980"></canvas><div class="sh"></div></div></div><div class="acts"><button id="sv" data-i="sv"></button><button id="sh2" class="g" data-i="sh"></button><button id="rs" class="g" data-i="rs"></button></div><a class="acc" hidden style="margin-top:26px"><span data-i="ib"></span> <bdi></bdi></a></div>
</main>
<div id="cd"></div><div id="md"><div><img id="mi" alt="التذكرة"><p data-i="md">اضغط مطولًا على الصورة لحفظها، ثم اضغط في أي مكان للإغلاق.</p></div></div>
<script>
/* ضع حسابك هنا مثل '@your_account' */
const ACCOUNT='';const LINK='';
/* رابط Google Apps Script لتسجيل المشاركين في Google Sheets */
const SHEET_URL='';
const IM=["tickets/01_engineering.png","tickets/02_economics_political_science.png","tickets/03_science.png","tickets/04_medicine_health_sciences.png","tickets/05_arts_social_sciences.png","tickets/06_agricultural_marine_sciences.png","tickets/07_law.png","tickets/08_nursing.png","tickets/09_education.png"];
const B=[[35,357,210,411],[33,357,210,411],[35,357,204,411],[35,352,210,406],[33,352,210,406],[35,352,204,406],[35,342,210,396],[33,342,210,396],[35,342,204,396]];
const R=[0,0,0,1,1,1,2,2,2].map(r=>[[357,411],[352,406],[342,396]][r]);
const L=[["الهندسة","#7fb2f2"],["الاقتصاد والعلوم السياسية","#f0af46"],["العلوم","#3cd7b4"],["الطب والعلوم الصحية","#f04b3c"],["الآداب والعلوم الاجتماعية","#e6914b"],["الزراعة والعلوم البحرية","#64d25f"],["القانون","#e6553a"],["التمريض","#c8c8d2"],["التربية","#f0be3c"]];
const $=s=>document.querySelector(s),cv=$('#tk'),cx=cv.getContext('2d');
const imgs=IM.map(s=>{const i=new Image();i.onload=draw;i.src=s;return i});
let cur=-1,sp=2;const HD=ACCOUNT.trim()?(ACCOUNT.trim().startsWith('@')?ACCOUNT.trim():'@'+ACCOUNT.trim()):'';if(HD)cv.height=1050;
function strip(){if(!HD)return;const o=document.createElement('canvas');o.width=o.height=1;const oc=o.getContext('2d');oc.drawImage(imgs[cur],2,976,1,1,0,0,1,1);const p=oc.getImageData(0,0,1,1).data;cx.fillStyle='rgb('+p[0]+','+p[1]+','+p[2]+')';cx.fillRect(0,980,652,cv.height-980);cx.direction='ltr';cx.textAlign='center';cx.textBaseline='middle';cx.font="600 28px 'IBM Plex Sans Arabic',Tahoma,sans-serif";cx.shadowColor=L[cur][1];cx.shadowBlur=14;cx.fillStyle='#fff';cx.fillText(HD,326,980+(cv.height-980)/2);cx.shadowBlur=0}
function fit(t,w){let s=28;cx.font=`600 ${s}px 'IBM Plex Sans Arabic',Tahoma,sans-serif`;while(s>15&&cx.measureText(t).width>w){s--;cx.font=`600 ${s}px 'IBM Plex Sans Arabic',Tahoma,sans-serif`}}
function put(t,x,y,w){if(!t)return;const ar=/[\u0600-\u06FF]/.test(t);fit(t,w*2-26);cx.textBaseline='middle';cx.fillStyle='#fff';cx.direction=ar?'rtl':'ltr';cx.textAlign=ar?'right':'left';cx.fillText(t,ar?(x+w)*2-14:x*2+14,(y+13)*2+1)}
function draw(){if(cur<0)return;cx.clearRect(0,0,652,cv.height);if(imgs[cur].complete){cx.drawImage(imgs[cur],0,0,652,980);strip()}const b=B[cur],r=R[cur];put($('#nm').value.trim(),b[0],r[0],b[2]);put($('#mj').value.trim(),b[0],r[1],b[2])}
const cl=$('#cl');let lg='ar';
const EN=['Engineering','Economics & Political Science','Science','Medicine & Health Sciences','Arts & Social Sciences','Agricultural & Marine Sciences','Law','Nursing','Education'];
const T={ar:{ib:'بمبادرة من',pv:'بالتسجيل توافق على حفظ اسمك وتخصصك لأغراض الفعالية.',t:'سديم',s:'اختر كليتك واكتب بياناتك، وتظهر لك تذكرتك الخاصة جاهزة للحفظ والمشاركة.',c:'الكلية',n:'الاسم',m:'التخصص',pn:'اكتب اسمك',pm:'مثال: هندسة ميكانيكية',go:'سجّل واستلم تذكرتك',sv:'احفظ تذكرتك',sh:'شارك',rs:'تسجيل جديد',e1:'اختر كليتك أولًا.',e2:'اكتب اسمك.',e3:'اكتب تخصصك.',md:'اضغط مطولًا على الصورة لحفظها، ثم اضغط في أي مكان للإغلاق.',st:'تذكرتي إلى الفضاء',b:'EN'},
en:{ib:'An initiative by',pv:'By registering, you agree to your name and major being saved for this event.',t:'SADEEM',s:'Pick your college, enter your details, and get your own ticket to space, ready to save and share.',c:'College',n:'Name',m:'Major',pn:'Your full name',pm:'e.g. Mechanical Engineering',go:'Register & get ticket',sv:'Save ticket',sh:'Share',rs:'New registration',e1:'Choose your college first.',e2:'Enter your name.',e3:'Enter your major.',md:'Press and hold the image to save it, then tap anywhere to close.',st:'My ticket to space',b:'عربي'}};
function bc(){cl.innerHTML='';L.forEach((c,i)=>{const b=document.createElement('button');b.className='ch';b.style.setProperty('--c',c[1]);b.innerHTML='<i></i>'+(lg=='ar'?c[0]:EN[i]);b.setAttribute('aria-pressed',i==cur);b.onclick=()=>pick(i);cl.append(b)})}
function setLang(){const D=document.documentElement;D.lang=lg;D.dir=lg=='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[lg][e.dataset.i]);document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T[lg][e.dataset.p]);$('#lg').textContent=T[lg].b;$('#er').textContent='';bc()}
$('#lg').onclick=()=>{lg=lg=='ar'?'en':'ar';setLang()};
function pick(i){cur=i;[...cl.children].forEach((b,j)=>b.setAttribute('aria-pressed',j==i));document.documentElement.style.setProperty('--ac',L[i][1]);sp=34;const t=$('#tkw');t.classList.remove('sw');void t.offsetWidth;t.classList.add('sw');draw()}

document.fonts&&document.fonts.ready.then(draw);
$('#stg').addEventListener('pointermove',e=>{const r=$('#tkw').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;const t=$('#tkw').style;t.setProperty('--ry',((x-.5)*28)+'deg');t.setProperty('--rx',((.5-y)*22)+'deg');t.setProperty('--gx',x*100+'%');t.setProperty('--gy',y*100+'%')});
$('#stg').addEventListener('pointerleave',()=>{const t=$('#tkw').style;t.setProperty('--rx','0deg');t.setProperty('--ry','0deg')});
$('#go').onclick=()=>{const er=$('#er'),n1=$('#nm').value.trim(),m1=$('#mj').value.trim();if(cur<0)return er.textContent='اختر كليتك أولًا.';if(!n1)return er.textContent='اكتب اسمك.';if(!m1)return er.textContent='اكتب تخصصك.';er.textContent='';if(SHEET_URL)try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({name:n1,major:m1,college:EN[cur],collegeAr:L[cur][0],lang:lg})}).catch(()=>{})}catch(e){}const d=$('#cd');d.className='on';let n=3;d.textContent=n;sp=60;const iv=setInterval(()=>{n--;if(n>0){d.textContent=n;sp=60;return}clearInterval(iv);d.textContent='';d.className='on fl';document.body.classList.add('done');scrollTo(0,0);(document.fonts?document.fonts.ready:Promise.resolve()).then(draw);const t=$('#tkw');t.classList.remove('sw');void t.offsetWidth;t.classList.add('sw');setTimeout(()=>d.className='',600)},650)};
$('#sv').onclick=save;$('#rs').onclick=()=>{document.body.classList.remove('done');$('#nm').value='';$('#mj').value=''};
$('#sh2').onclick=async()=>{try{const bl=await new Promise(r=>cv.toBlob(r,'image/png'));const f=new File([bl],'ticket.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:T[lg].st});return}}catch(e){if(e&&e.name==='AbortError')return}save()};
if(!navigator.share)$('#sh2').style.display='none';
async function save(){try{const bl=await new Promise(r=>cv.toBlob(r,'image/png'));const nm=($('#nm').value.trim()||'ticket').replace(/[\\\/:*?"<>|]/g,'');if(typeof claude!=='undefined'){const dl=await claude.use('downloads');if(dl){await dl.save({filename:'Ticket-'+nm+'.png',data:bl});return}}else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='Ticket-'+nm+'.png';a.click();return}}catch(e){if(e&&e.code==='declined')return}
$('#mi').src=cv.toDataURL('image/png');$('#md').className='on'}
$('#md').onclick=()=>$('#md').className='';
const sk=$('#sky'),g=sk.getContext('2d');let W,H,S=[];const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function rs(){W=sk.width=innerWidth;H=sk.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<420;i++)S.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random(),t:Math.random()<.3});
function fr(){g.fillStyle='rgba(5,3,13,.35)';g.fillRect(0,0,W,H);const ac=getComputedStyle(document.documentElement).getPropertyValue('--ac');sp+=(1.6-sp)*.04;for(const s of S){const z0=s.z;s.z-=.0016*(rm?.4:sp);if(s.z<=.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;continue}const k=Math.max(W,H)/2,x1=s.x/s.z*k*.5+W/2,y1=s.y/s.z*k*.5+H/2,z2=Math.min(1,s.z+.0016*sp*2.2),x0=s.x/z2*k*.5+W/2,y0=s.y/z2*k*.5+H/2;g.strokeStyle=s.t?ac:'#fff';g.globalAlpha=Math.min(1,(1-s.z)*1.6);g.lineWidth=(1-s.z)*2.2+.3;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()}g.globalAlpha=1;requestAnimationFrame(fr)}fr();setLang();document.querySelector('.pv').hidden=!SHEET_URL;document.querySelectorAll('.acc').forEach(a=>{a.hidden=!HD;if(HD){a.href=LINK||'https://instagram.com/'+HD.slice(1);a.target='_blank';a.rel='noopener';a.querySelector('bdi').textContent=HD}});
</script></body></html>
